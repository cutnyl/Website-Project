<button id="chat-widget-button" type="button">&#128172;</button>

<div id="chat-widget-container">
  <div class="chat-header">
    <h3>AI Assistant</h3>
    <button class="close-chat" id="closeChatBtn" type="button">&times;</button>
  </div>
  
  <div class="chat-messages" id="chatMessages">
    <div class="message incoming">
      <div class="bubble">Hello! What can I help you with?</div>
    </div>
  </div>

  <div class="chat-footer">
    <input type="text" id="userInput" placeholder="Ketik pesan..." />
    <button type="button" id="sendBtn">Send</button>
  </div>
</div>
